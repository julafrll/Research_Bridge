<!-- Supabase "Magic Link" template — used for "Email me a code" sign-in.
     Subject: Your Research Bridge sign-in code -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; color: #0f1f3d;">
  <h2 style="margin-bottom: 8px;">Your sign-in code</h2>
  <p>Enter this code on the Research Bridge sign-in page:</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; margin: 24px 0; font-family: monospace;">{{ .Token }}</p>
  <p style="color: #5b6b82; font-size: 14px;">The code expires in one hour. If you didn't try to sign in, you can ignore this email.</p>
</div>
