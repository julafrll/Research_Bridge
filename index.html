<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Research_Bridge_Logo-selection.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research Bridge — International Online Research Paper Competition</title>
    <meta name="description" content="Research Bridge Online Research Paper Competition: students worldwide submit research papers and scientific posters, judged by professionals. From Curiosity to Discovery." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <script>
      // Apply the saved (or device) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('rb-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
